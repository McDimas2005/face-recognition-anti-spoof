name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main
      - deploy/free-cloud
    paths:
      - "Dockerfile"
      - "deploy/huggingface/**"
      - "apps/api/**"
      - "models/**"
      - "legacy/**"
      - "packages/shared/**"
      - "scripts/**"
      - ".github/workflows/deploy-huggingface.yml"
      - "README.md"
      - ".env.example"
      - ".env.production.example"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-huggingface-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync repo to Hugging Face Space
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: TsukishimaAlan20
          HF_SPACE_NAME: face-recognition-anti-spoof-api
        run: |
          git remote add hf-space https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          git push --force hf-space HEAD:main