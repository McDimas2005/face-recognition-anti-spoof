name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - main
      - deploy/free-cloud
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/huggingface/**"
      - "apps/api/**"
      - "models/**"
      - "packages/shared/**"
      - "scripts/**"
      - ".env.example"
      - ".env.production.example"
      - "docs/**"
      - ".github/workflows/sync-to-huggingface.yml"
  workflow_dispatch:

concurrency:
  group: deploy-huggingface-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync backend deployment to Hugging Face Space
    runs-on: ubuntu-latest

    env:
      HF_USERNAME: TsukishimaAlan20
      HF_SPACE_NAME: face-recognition-anti-spoof-api

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Validate Hugging Face token
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "Missing HF_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Build Hugging Face Space sync directory
        run: |
          set -euo pipefail

          rm -rf /tmp/hf-space-sync
          mkdir -p /tmp/hf-space-sync

          cp Dockerfile /tmp/hf-space-sync/Dockerfile

          if [ -f ".dockerignore" ]; then
            cp .dockerignore /tmp/hf-space-sync/.dockerignore
          fi

          if [ -f "deploy/huggingface/README.md" ]; then
            cp deploy/huggingface/README.md /tmp/hf-space-sync/README.md
          else
            cat > /tmp/hf-space-sync/README.md <<'EOF'
          ---
          title: Face Recognition Anti-Spoof API
          emoji: 🧑‍💻
          colorFrom: blue
          colorTo: gray
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          # Face Recognition Anti-Spoof API

          FastAPI backend for the Face Attendance Platform portfolio demo.

          This Space runs the backend API only. The frontend is deployed separately on Vercel, and durable data is stored in Neon PostgreSQL.

          Current model/provider note: this deployment uses the demo-grade detector/embedder/liveness provider and is intended for portfolio demonstration, not production biometric security.
          EOF
          fi

          mkdir -p /tmp/hf-space-sync/deploy
          cp -R deploy/huggingface /tmp/hf-space-sync/deploy/huggingface

          mkdir -p /tmp/hf-space-sync/apps
          cp -R apps/api /tmp/hf-space-sync/apps/api

          if [ -d "models" ]; then
            cp -R models /tmp/hf-space-sync/models
          fi

          # Do not copy legacy model assets to Hugging Face.
          # The Space deployment intentionally excludes heavy / legacy model files.
          # The backend should fall back to the lightweight demo behavior when DNN assets are absent.
          mkdir -p /tmp/hf-space-sync/legacy
          cat > /tmp/hf-space-sync/legacy/README.md <<'EOF'
          Legacy model assets are intentionally excluded from the free Hugging Face deployment.

          The portfolio deployment uses the backend demo provider and avoids pushing large or license-sensitive historical model files to the Space repository.
          EOF

          if [ -d "packages/shared" ]; then
            mkdir -p /tmp/hf-space-sync/packages
            cp -R packages/shared /tmp/hf-space-sync/packages/shared
          fi

          if [ -d "scripts" ]; then
            cp -R scripts /tmp/hf-space-sync/scripts
          fi

          if [ -f ".env.example" ]; then
            cp .env.example /tmp/hf-space-sync/.env.example
          fi

          if [ -f ".env.production.example" ]; then
            cp .env.production.example /tmp/hf-space-sync/.env.production.example
          fi

          # Remove any accidental LFS pointer, large legacy model files, or files rejected by HF Git.
          find /tmp/hf-space-sync -type f \( \
            -name "*.h5" -o \
            -name "*.keras" -o \
            -name "*.pth" -o \
            -name "*.pt" -o \
            -name "*.onnx" -o \
            -name "*.caffemodel" \
          \) -print -delete

          find /tmp/hf-space-sync -type f -size +9M -print -delete

          echo "Prepared Hugging Face sync directory:"
          find /tmp/hf-space-sync -maxdepth 4 -type f | sort | sed 's#/tmp/hf-space-sync/##'

      - name: Push clean deployment folder to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          cd /tmp/hf-space-sync

          git init
          git config user.email "actions@github.com"
          git config user.name "github-actions"

          git add .
          git commit -m "Deploy backend from GitHub ${GITHUB_SHA}"

          git branch -M main
          git remote add hf-space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force hf-space main